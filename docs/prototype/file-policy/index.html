<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>文件策略 · Network Lens</title>
    <style>
      /* Offline preview tokens: security-console-design/assets/preview-tokens.css. */
      :root {
        color-scheme: light;
        --console-font:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI",
          "Microsoft YaHei UI", Arial, sans-serif;
        --p1: #d9f4ee;
        --p5: #1db887;
        --p6: #00ab7a;
        --p7: #039972;
        --p8: #008563;
        --p10: #013c32;
        --gray-1: #fff;
        --gray-2: #f8f9fa;
        --gray-3: #f2f3f5;
        --gray-4: #e8eaed;
        --gray-5: #dfe1e6;
        --gray-6: #aeb2b8;
        --gray-7: #8a9099;
        --gray-8: #525966;
        --gray-9: #242933;
        --red-1: #ffe8e6;
        --red-6: #f0131e;
        --red-7: #c90616;
        --orange-1: #fff8e6;
        --orange-6: #f58a02;
        --orange-7: #cf6e00;
        --green-1: #eff8ee;
        --green-6: #52c41a;
        --green-7: #389e0d;
        --blue-1: #e6f7ff;
        --blue-6: #1890ff;
        --blue-7: #096dd9;
        --content-padding: 16px;
        --panel-padding: 24px;
        --panel-gap: 16px;
        --panel-radius: 8px;
        --table-row-regular: 48px;
        --shadow-2-left: -8px 0 24px rgb(0 0 0 / 16%);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--gray-3);
        font: 14px/1.6 var(--console-font);
        color: var(--gray-9);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--gray-5);
        border-radius: 6px;
        background: white;
        color: var(--gray-9);
        min-height: 36px;
        padding: 6px 14px;
        transition: background 0.15s;
      }
      button:hover {
        background: var(--gray-2);
        border-color: var(--p6);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--p6);
        border-color: var(--p6);
        color: #fff;
        font-weight: 600;
      }
      button.primary:hover {
        background: var(--p5);
      }
      button.text {
        border: 0;
        color: var(--p8);
        background: transparent;
        padding: 4px 8px;
      }
      button.danger {
        color: var(--red-7);
      }
      :focus-visible {
        outline: 3px solid var(--blue-6);
        outline-offset: 3px;
      }
      input,
      select,
      textarea {
        border: 1px solid var(--gray-5);
        border-radius: 5px;
        padding: 8px 10px;
        background: white;
        color: var(--gray-9);
        max-width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 88px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.8px;
        line-height: 1.4;
      }
      h2 {
        font-size: 18px;
        line-height: 1.5;
      }
      h3 {
        font-size: 15px;
      }
      small,
      .small {
        font-size: 12px;
      }
      .muted {
        color: var(--gray-8);
      }
      .caption {
        color: var(--gray-7);
        font-size: 12px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2px;
        font-weight: 650;
        color: var(--p8);
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--gray-4);
        border-radius: 8px;
        padding: 24px;
        min-width: 0;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 4px;
        padding: 2px 8px;
        background: var(--gray-3);
        font-size: 12px;
        white-space: nowrap;
      }
      .badge.green {
        background: var(--green-1);
        color: #286917;
      }
      .badge.red {
        background: var(--red-1);
        color: var(--red-7);
      }
      .badge.orange {
        background: var(--orange-1);
        color: #986000;
      }
      .badge.blue {
        background: var(--blue-1);
        color: var(--blue-7);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .notice {
        padding: 12px 16px;
        border: 1px solid #f1dbac;
        background: var(--orange-1);
        border-radius: 6px;
        color: #765414;
        font-size: 13px;
      }
      .notice.info {
        background: var(--blue-1);
        border-color: #c5e8ff;
        color: var(--blue-7);
      }
      .notice.success {
        background: var(--green-1);
        border-color: #d6ebd0;
        color: #286917;
      }
      .notice.error {
        background: var(--red-1);
        border-color: #f8c3be;
        color: var(--red-7);
      }
      .preview-bar {
        background: #fff;
        border-bottom: 1px solid var(--gray-4);
        padding: 10px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .preview-mark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--gray-8);
      }
      .brand-mark {
        width: 25px;
        height: 25px;
        background: var(--p10);
        color: white;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      .switcher {
        display: flex;
        gap: 3px;
        border-radius: 6px;
        background: var(--gray-3);
        padding: 3px;
      }
      .switcher button {
        border: 0;
        background: none;
        min-height: 28px;
        padding: 3px 12px;
        font-size: 12px;
      }
      .switcher .selected {
        background: white;
        color: var(--p8);
        box-shadow: 0 1px 4px #0000000b;
        font-weight: 600;
      }
      .container {
        max-width: 1800px;
        margin: auto;
        padding: 24px 32px 16px;
      }
      .heading {
        margin-bottom: 24px;
      }
      .heading p {
        margin-top: 6px;
        color: var(--gray-8);
      }
      .crumb {
        font-size: 12px;
        color: var(--gray-8);
        margin-bottom: 12px;
      }
      .nav {
        display: flex;
        gap: 28px;
        border-bottom: 1px solid var(--gray-5);
        margin-bottom: 24px;
      }
      .nav button {
        background: none;
        border: 0;
        border-radius: 0;
        padding: 12px 2px;
        color: var(--gray-8);
        font-weight: 500;
        position: relative;
      }
      .nav button.active {
        color: var(--p8);
        font-weight: 650;
      }
      .nav button.active:after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--p6);
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr);
        gap: 24px;
        align-items: center;
        background: #fff;
        padding: 28px;
        border-radius: 8px;
        border: 1px solid var(--gray-4);
        margin-bottom: 16px;
        overflow: hidden;
      }
      .hero h2 {
        font-size: 24px;
        line-height: 1.45;
        max-width: 620px;
        margin: 8px 0 10px;
      }
      .hero p {
        color: var(--gray-8);
        max-width: 580px;
      }
      .hero-actions {
        margin-top: 20px;
      }
      .pipeline {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 34px 1.2fr 34px 1fr;
        align-items: center;
        background: var(--gray-2);
        padding: 28px 16px;
        border-radius: 8px;
        border: 1px solid var(--gray-4);
      }
      .pipe-node {
        text-align: center;
        font-size: 12px;
      }
      .pipe-icon {
        height: 50px;
        width: 50px;
        border: 1px solid var(--gray-5);
        background: #fff;
        border-radius: 12px;
        display: grid;
        place-items: center;
        margin: 0 auto 10px;
        font:
          600 20px ui-monospace,
          monospace;
      }
      .pipe-node.center .pipe-icon {
        background: var(--p10);
        color: #fff;
        border: 0;
        width: 60px;
        height: 60px;
      }
      .pipe-arrow {
        color: var(--gray-6);
        text-align: center;
        font-size: 22px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: #fff;
        border: 1px solid var(--gray-4);
        border-radius: 8px;
        padding: 20px 0;
        margin-bottom: 16px;
      }
      .stat {
        padding: 0 24px;
        border-right: 1px solid var(--gray-4);
      }
      .stat:last-child {
        border: 0;
      }
      .stat .value {
        font-size: 30px;
        line-height: 1.4;
        font-weight: 650;
        letter-spacing: -1px;
        margin-top: 4px;
      }
      .stat .value span {
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0;
        margin-left: 6px;
        color: var(--gray-8);
      }
      .two-col {
        display: grid;
        grid-template-columns: minmax(0, 2.2fr) minmax(300px, 1fr);
        gap: 16px;
      }
      .section-head {
        margin-bottom: 16px;
      }
      .table-scroll {
        overflow: auto;
        max-height: 440px;
        border-top: 1px solid var(--gray-4);
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        font-size: 13px;
        white-space: nowrap;
      }
      th,
      td {
        height: 48px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--gray-4);
        text-align: left;
        background: white;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--gray-2);
        color: var(--gray-8);
        font-weight: 500;
        z-index: 2;
      }
      td:first-child,
      th:first-child {
        position: sticky;
        left: 0;
        z-index: 1;
        min-width: 180px;
      }
      th:first-child {
        z-index: 3;
      }
      td:last-child,
      th:last-child {
        position: sticky;
        right: 0;
        z-index: 1;
      }
      th:last-child {
        z-index: 3;
      }
      tbody tr:hover td {
        background: var(--gray-2);
      }
      .table-footer {
        font-size: 12px;
        color: var(--gray-8);
        padding-top: 8px;
        text-align: right;
      }
      .cover-item {
        display: flex;
        gap: 12px;
        padding: 16px 0;
        border-bottom: 1px solid var(--gray-4);
      }
      .cover-item:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .channel-icon {
        flex: none;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 1px solid var(--gray-4);
        border-radius: 8px;
        color: var(--gray-8);
        font-size: 12px;
        font-weight: 650;
      }
      .cover-item p {
        font-size: 12px;
        color: var(--gray-8);
        margin-top: 4px;
      }
      .cover-item .badge {
        margin-top: 8px;
      }
      .mini-event {
        display: flex;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--gray-4);
        align-items: flex-start;
      }
      .mini-event .event-line {
        width: 3px;
        height: 36px;
        background: var(--gray-5);
        border-radius: 4px;
        flex: none;
      }
      .mini-event .event-line.red {
        background: var(--red-6);
      }
      .mini-event .event-line.green {
        background: var(--green-6);
      }
      .mini-event .event-line.orange {
        background: var(--orange-6);
      }
      .mini-event p {
        font-size: 12px;
        color: var(--gray-8);
      }
      .action-label {
        display: inline-block;
        padding: 2px 0;
        font-size: 12px;
      }
      .action-label.deny {
        color: var(--red-7);
      }
      .action-label.ask {
        color: #986000;
      }
      .action-label.allow {
        color: #286917;
      }
      .asset-type {
        display: inline-grid;
        place-items: center;
        background: var(--gray-3);
        border: 1px solid var(--gray-4);
        height: 28px;
        width: 28px;
        border-radius: 5px;
        font-size: 9px;
        letter-spacing: -0.5px;
        color: var(--gray-8);
        margin-right: 10px;
        vertical-align: middle;
      }
      .filter {
        display: flex;
        gap: 8px;
        margin: 16px 0;
        align-items: center;
        flex-wrap: wrap;
      }
      .filter input {
        width: 250px;
      }
      .empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--gray-8);
      }
      .split {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 16px;
      }
      .scenario {
        width: 100%;
        text-align: left;
        padding: 16px;
        margin-bottom: 8px;
        display: block;
      }
      .scenario.active {
        border-color: var(--p6);
        background: #f2fbf7;
      }
      .scenario .num {
        font-size: 11px;
        color: var(--p8);
        margin-bottom: 6px;
        display: block;
      }
      .scenario p {
        font-size: 12px;
        color: var(--gray-8);
        margin-top: 4px;
      }
      .lab-request {
        border: 1px solid var(--gray-4);
        border-radius: 6px;
        background: var(--gray-2);
        padding: 16px;
        margin: 20px 0;
      }
      .kv {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 12px;
        font-size: 13px;
      }
      .kv dt {
        color: var(--gray-8);
      }
      .kv dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .result {
        border: 1px solid var(--gray-4);
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
      }
      .result h3 {
        font-size: 18px;
        margin: 8px 0;
      }
      .trace {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 24px 0;
      }
      .trace-step {
        border-top: 2px solid var(--p6);
        padding-top: 12px;
        font-size: 12px;
      }
      .trace-step b {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .trace-step span {
        color: var(--gray-8);
      }
      .channel-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .health-card h3 {
        font-size: 17px;
        margin: 16px 0 4px;
      }
      .health-card p {
        font-size: 13px;
        color: var(--gray-8);
        min-height: 62px;
      }
      .health-card .badge {
        margin: 16px 0;
      }
      .health-card button {
        margin-top: 12px;
      }
      .step-list {
        counter-reset: setup;
        padding-left: 0;
        list-style: none;
        margin: 16px 0;
      }
      .step-list li {
        counter-increment: setup;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--gray-4);
      }
      .step-list li:before {
        content: counter(setup);
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        background: var(--gray-3);
        border-radius: 50%;
        font-size: 12px;
      }
      .footer {
        margin-top: 24px;
        font-size: 12px;
        color: var(--gray-8);
        padding: 8px 0;
      }
      .footer button {
        font-size: 12px;
      }
      .grant-item {
        padding: 16px 0;
        border-bottom: 1px solid var(--gray-4);
      }
      .grant-item h3 {
        margin-bottom: 4px;
      }
      dialog {
        border: 0;
        border-radius: 8px;
        padding: 0;
        width: 560px;
        max-width: calc(100vw - 32px);
        max-height: calc(100dvh - 40px);
        box-shadow: 0 20px 70px #0003;
        color: var(--gray-9);
      }
      dialog::backdrop {
        background: #101e2b55;
      }
      dialog.drawer {
        position: fixed;
        inset: 0 0 0 auto;
        margin: 0;
        height: 100dvh;
        max-height: 100dvh;
        width: 880px;
        max-width: 100vw;
        border-radius: 0;
        box-shadow: var(--shadow-2-left);
      }
      .dialog-layout {
        display: flex;
        flex-direction: column;
        max-height: calc(100dvh - 40px);
      }
      .drawer .dialog-layout {
        height: 100dvh;
        max-height: 100dvh;
      }
      .dialog-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--gray-4);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex: none;
      }
      .dialog-header h2 {
        font-size: 18px;
      }
      .dialog-body {
        padding: 24px;
        overflow: auto;
        min-height: 0;
        flex: 1;
      }
      .dialog-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--gray-4);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex: none;
        background: #fff;
      }
      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 20px;
      }
      .field > label {
        font-size: 13px;
        font-weight: 500;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
      }
      .field small {
        color: var(--gray-8);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      .steps {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }
      .steps span {
        flex: 1;
        padding: 10px 4px;
        border-bottom: 2px solid var(--gray-4);
        font-size: 12px;
        color: var(--gray-8);
      }
      .steps span.active {
        color: var(--p8);
        border-color: var(--p6);
        font-weight: 650;
      }
      .policy-quote {
        background: var(--gray-2);
        border-left: 3px solid var(--p6);
        padding: 16px;
        margin: 20px 0;
      }
      .diff {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 16px 0;
      }
      .diff pre {
        background: var(--gray-2);
        padding: 16px;
        white-space: pre-wrap;
        font:
          12px/1.8 ui-monospace,
          monospace;
        border-radius: 6px;
      }
      .diff .after {
        background: var(--green-1);
      }
      .toast {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        background: var(--p10);
        color: white;
        box-shadow: 0 4px 16px #0002;
        border-radius: 6px;
        padding: 10px 20px;
        max-width: 90vw;
        font-size: 13px;
      }
      .toast[hidden] {
        display: none;
      }
      .spacer {
        height: 16px;
      }
      .inline-check {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
      }
      .inline-check input {
        width: auto;
      }
      .flow-callout {
        background: var(--gray-2);
        border-radius: 6px;
        padding: 16px;
        font-size: 13px;
        margin-top: 16px;
      }
      .role-note {
        font-size: 12px;
        margin-top: 12px;
        color: var(--gray-8);
      }
      @media (min-width: 1600px) {
        .container {
          padding-left: 40px;
          padding-right: 40px;
        }
        .hero {
          padding: 36px;
        }
        .hero h2 {
          font-size: 28px;
        }
      }
      @media (max-width: 1100px) {
        .hero,
        .two-col {
          grid-template-columns: 1fr;
        }
        .pipeline {
          padding: 18px;
        }
        .two-col > .stack {
          grid-template-columns: 1fr 1fr;
        }
        .split {
          grid-template-columns: 290px minmax(0, 1fr);
        }
        .channel-grid {
          grid-template-columns: 1fr;
        }
        .health-card p {
          min-height: 0;
        }
      }
      @media (max-width: 767px) {
        .container {
          padding: 16px;
        }
        .preview-bar {
          padding: 10px 16px;
          flex-wrap: wrap;
        }
        .heading {
          align-items: flex-start;
          flex-direction: column;
        }
        .heading > .row {
          width: 100%;
        }
        .nav {
          gap: 20px;
          overflow: auto;
          white-space: nowrap;
        }
        .hero {
          padding: 20px;
          gap: 20px;
        }
        .hero h2 {

    <script>

                  title: "未知终端直接读取密钥",

            : [
                {
                  id: "office",
                  title: "Excel 正常编辑合同",

                  rule: "office",
                  actor: "已验证的办公应用",
                  op: "write",
                  channel: "native",
                  dest: "原文件",
                },
                {

                  title: "AI 发送薪资汇总",

                  rule: "payroll",
                  actor: "受管 AI",

                  dest: "外部模型 · model.example",

                {

                  rule: "contract",
                  actor: "受管 AI",
                  op: "disclose",
                  channel: "gateway",

                  title: "AI 删除客户合同",

                  op: "delete",
                  channel: "hook",
                  dest: "原文件",

              ];
        return [
          ...base,
          ...ctx()
            .rules.filter((r) => r.id.startsWith("custom-"))
            .flatMap((r) =>
              Object.entries(opNames).map(([op, n]) => ({
                id: r.id + "-" + op,
                title: r.name + " · " + n,
                subtitle: "验证新发布的自定义策略",
                rule: r.id,
                actor: r.actor,
                op,
                channel: op === "disclose" ? "gateway" : "hook",
                dest:
                  op === "disclose" ? "外部模型 · model.example" : "本地文件",
              })),
            ),
        ];
      }
      function scene() {
        return (
          scenarios().find((s) => s.id === selectedScenario) || scenarios()[0]
        );
      }
      function ruleFor(s) {
        return ctx().rules.find((r) => r.id === s.rule);
      }
      function coverageName(c) {
        return {
          hook: "受管 AI 操作关口",
          gateway: "模型提交关口",
          native: platform() + " 系统文件保护",
        }[c];
      }
      function evaluate(s) {
        const c = ctx(),
          r = ruleFor(s);
        if (!c[s.channel])
          return {
            kind: "uncovered",
            reason:
              coverageName(s.channel) + "当前未就绪，无法证实此操作被阻断。",
          };
        const d = r[s.op];
        if (d === "ask") {
          const grant = c.grants.find(
            (g) =>
              g.status === "active" &&
              g.expiresAt > Date.now() &&
              g.scenario === s.id &&
              g.rev === c.rev &&
              g.file === r.file &&
              g.actor === s.actor &&
              g.dest === s.dest &&
              g.fingerprint === fingerprint(s),

            return {
              kind: "allow",
              grant,
              reason: "精确匹配单次授权；本次重试后许可即被消费。",
            };

          kind: d,
          reason:
            d === "deny"

        return `
<section class="hero"><div><div class="eyebrow">FILE GUARD / ${state.persona === "dev" ? "DEVELOPER" : "WORKSPACE"}</div><div class="row wrap">${badge(c.native && c.hook && c.gateway ? "所选通道已就绪 · 模拟" : "部分覆盖 · 模拟", c.native && c.hook && c.gateway ? "green" : "orange")}<span class="caption">策略 v${c.rev} · ${platform()}</span></div><h2>${state.persona === "dev" ? "让 AI 专注写代码，<br>把生产密钥留在边界内。" : "合同照常编辑，<br>敏感信息出门前再确认。"}</h2><p>${state.persona === "dev" ? "源码可以读写，发布配置需要确认，凭据默认禁止访问。规则按具体任务执行，保留每一步的判定依据。" : "区分日常编辑与模型外发；先预览脱敏副本，再授权明确的一次提交，保留原文件和完整操作记录。"}</p><div class="row hero-actions">${actionButton("体验一次保护", "tab", "lab", "primary")}${actionButton("查看实际覆盖", "tab", "health")}</div></div><div class="pipeline" aria-label="文件经过策略判断后进入工作流程"><div class="pipe-node"><div class="pipe-icon">${state.persona === "dev" ? "{ }" : "Aa"}</div><strong>${state.persona === "dev" ? "项目与凭据" : "业务文档"}</strong><div class="caption">范围内文件</div></div><div class="pipe-arrow">→</div><div class="pipe-node center"><div class="pipe-icon">✓</div><strong>文件策略</strong><div class="caption">主体 · 操作 · 去向</div></div><div class="pipe-arrow">→</div><div class="pipe-node"><div class="pipe-icon">AI</div><strong>继续工作</strong><div class="caption">按需允许 / 确认</div></div></div></section>

        draft.read = item.recommend === "read-deny" ? "deny" : "allow";
        draft.write = item.recommend === "read-deny" ? "deny" : "ask";
        draft.disclose = item.recommend === "read-deny" ? "deny" : "ask";
        dirty = true;
        wizard();
      }
      function staleFile(file) {
        ctx().resourceVersions ??= {};
        ctx().resourceVersions[file] = resourceVersion(file) + 1;
        for (const g of ctx().grants)
          if (g.status === "active" && g.file === file) g.status = "invalid";
        log({
          kind: "action",
          title: "文件样本已更新",
          file,
          reason: "旧文件版本对应的授权和副本预览失效，需重新验证。",
        });
        lastResult = null;
        render();
      }
      async function v2Click(action, value) {
        if (busy) return;
        switch (action) {
          case "repair-draft":
            ctx().hook = true;
            ctx().gateway = true;
            draft.baseRevision = ctx().rev;
            draft.checked = false;
            step = 2;
            log({
              kind: "action",
              title: "恢复策略所需通道",
              reason: "模拟恢复接收与探针；草稿保留，要求重新试运行。",
            });
            wizard();
            toast("草稿已保留，请重新试运行后发布。");
            break;
          case "scan-demo":
            await scanDemo();
            break;
          case "protect-candidate":
            protectCandidate(value);
            break;
          case "defer-candidate": {
            const i = discoveries().items.find((i) => i.id === value);
            i.status = i.status === "deferred" ? "pending" : "deferred";
            log({
              kind: "action",
              title: i.status === "deferred" ? "候选暂缓确认" : "候选重新纳入",
              file: i.file,
              reason: "不修改策略、不代表文件安全。",
            });
            render();
            break;
          }
          case "open-task":
            selectedScenario = value;
            state.tab = "lab";
            lastResult = null;
            render();
            break;
          case "change-file":
            staleFile(value);
            toast("文件版本已变化；旧许可与预览不可复用。");
            break;
          case "change-dest": {
            const sc = scene();
            ctx().destinations ??= {};
            ctx().destinations[value] = sc.dest.includes("alternate")
              ? "外部模型 · model.example"
              : "外部模型 · alternate.example";
            for (const g of ctx().grants)
              if (g.status === "active" && g.scenario === value)
                g.status = "invalid";
            log({
              kind: "action",
              title: "发送目的地已改变",
              reason: "原目的地的授权与脱敏预览不可用于新目标。",
            });
            lastResult = null;
            render();
            break;
          }
          case "fail-next":
            ctx().failNext = !ctx().failNext;
            render();
            toast("仅下一次允许执行的场景将模拟失败；不改变规则。");
            break;
          case "safe-example": {
            const e = log({
              kind: "allow",
              decision: "allow",
              receipt: "completed",
              title: "使用安全样例继续开发",
              sourceEventId: value,
              scenario: "secret",
              file: ".env.example",
              actor: "受管 AI",
              op: "read",
              dest: "本地上下文",
              ruleName: "公开样例材料",
              reason:
                "示例只提供配置字段名称，不包含生产值；原始凭据规则仍然禁止。",
            });
            lastResult = e;
            render();
            break;
          }
        }
      }
      // Keep the original event router; dispatch new actions through a separate capture.
      document.addEventListener("click", (event) => {
        const b = event.target.closest("button[data-action]");
        if (b && !b.disabled) return v2Click(b.dataset.action, b.dataset.value);
      });

      document.addEventListener("input", (e) => {
        const field = e.target.dataset.draft;
        if (field && draft) {
          draft[field] =
            e.target.type === "checkbox" ? e.target.checked : e.target.value;
          dirty = true;
          if (field !== "fail") draft.checked = false;
        }
      });
      document.addEventListener("change", (e) => {
        const field = e.target.dataset.draft;
        if (field && draft) {
          draft[field] =
            e.target.type === "checkbox" ? e.target.checked : e.target.value;
          dirty = true;
          if (field !== "fail") draft.checked = false;
        }
      });
      document.addEventListener("submit", async (e) => {
        if (e.target.id === "search-form") {
          e.preventDefault();
          query = e.target.q.value;
          filterKind = e.target.kind.value;
          const table = $(".table-scroll tbody");
          table.innerHTML =
            '<tr><td colspan="5"><div class="empty">正在查询演示记录…</div></td></tr>';
          await new Promise((r) => setTimeout(r, 180));
          render();
        }
      });
      document.addEventListener("click", async (event) => {
        const b = event.target.closest("button[data-action]");
        if (!b || b.disabled) return;
        const a = b.dataset.action,
          v = b.dataset.value;
        if (busy && !["close-modal"].includes(a)) return;
        switch (a) {
          case "tab":
            state.tab = v;
            lastResult = null;
            render();
            break;
          case "os":
          case "persona":
            state[a] = v;
            selectedScenario = state.persona === "dev" ? "secret" : "payroll";
            lastResult = null;
            query = "";
            filterKind = "all";
            render();
            break;
          case "new":
            newPolicy();
            break;
          case "close-drawer":
            closeDrawer();
            break;
          case "close-modal":
            closeModal();
            break;
          case "discard":
            closeModal();
            closeDrawer(true);
            break;
          case "rule":
            showRule(v);
            break;
          case "event":
            showEvent(v);
            break;
          case "scenario":
            selectedScenario = v;
            lastResult = null;
            render();
            break;
          case "run":
            await runScenario();
            break;
          case "grant":
            grantForm(v);
            break;
          case "save-grant":
            saveGrant(v);
            break;
          case "redact":
            redact(v);
            break;
          case "send-redacted": {
            if (!$("#redact-check").checked) {
              toast("请先确认副本内容。");
              return;
            }
            if (!ctx().gateway) {
              toast("提交关口不可用，请先恢复。");
              return;
            }
            const src = ctx().events.find((e) => e.id === v);
            if (
              !redactionPreview ||
              redactionPreview.eventId !== v ||
              redactionPreview.fingerprint !== fingerprint(scene())
            ) {
              toast("预览已失效，请重新验证并生成副本。");
              return;
            }
            redactionPreview = null;
            lastResult = log({
              kind: "allow",
              receipt: "completed",
              decision: "allow",
              sourceEventId: src.id,
              title: "提交脱敏副本",
              file: "薪资汇总.redacted.xlsx",
              actor: "受管 AI",
              op: "disclose",
              dest: scene().dest,
              ruleName: "用户确认的精确副本许可",
              reason:
                "模拟复扫与用户确认后提交副本；原文件未变，原件仍需单独授权。",
              scenario: "payroll",
            });
            closeModal();
            render();
            toast("脱敏副本提交模拟完成。");
            break;
          }
          case "clear-search":
            $("#search-form").q.value = "";
            $("#search-form").kind.value = "all";
            toast("输入已清空；点击“搜索”应用。");
            break;
          case "next":
            if (step === 0 && !validateDraft()) return;
            if (step === 2 && !draft.checked) {
              toast("请先完成试运行。");
              return;
            }
            step++;
            wizard();
            break;
          case "prev":
            step--;
            wizard();
            break;
          case "dryrun":
            busy = true;
            b.disabled = true;
            b.textContent = "正在模拟四种操作…";
            await new Promise((r) => setTimeout(r, 400));
            draft.checked = true;
            busy = false;
            wizard();
            toast("试运行完成；可查看每项结果。");
            break;
          case "publish":
            if (!draft.checked) {
              toast("请先重新试运行。");
              return;
            }
            confirmAction(
              "发布这条文件策略？",
              `<p>将为 <strong>${escapeHTML(draft.file)}</strong> 增加一条规则，从 v${ctx().rev} 更新到 v${ctx().rev + 1}。已有临时授权将失效。</p><div class="spacer"></div><p class="muted">影响受管 AI 操作与模型提交。上一版规则保留，可回滚。</p>`,
              "publish",
            );
            break;
          case "confirm-publish":
            await publish();
            break;
          case "rollback":
            confirmAction(
              "回滚到上一版规则？",
              "<p>将以先前规则创建新的修订版本并模拟验证。当前临时授权失效，审计记录保留，已执行的文件操作不会撤销。</p>",
              "rollback",
            );
            break;
          case "confirm-rollback": {
            closeModal();
            const c = ctx();
            if (!c.history.length) return;
            c.rules = c.history.pop();
            c.rev++;
            invalidateGrants();
            log({
              kind: "action",
              title: "策略回滚并验证通过",
              reason:
                "恢复上一配置，生成新修订版 v" +
                c.rev +
                "；模拟执行端回执通过。",
            });
            render();
            toast("回滚成功，已生成新的策略修订版。");
            break;
          }
          case "lose":
            confirmAction(
              "模拟该通道失效？",
              `<p>${coverageName(v)} 将显示未覆盖。其他就绪通道继续工作，恢复时需要重新校验。</p>`,
              "lose",
              v,
            );
            break;
          case "confirm-lose":
            closeModal();
            ctx()[v] = false;
            log({
              kind: "action",
              title: coverageName(v) + "失效",
              reason: "模拟权限被撤销或执行端失联；相关场景降级为未覆盖。",
            });
            render();
            toast("已模拟失效，覆盖状态已更新。");
            break;
          case "connect":
            connect(v);
            break;
          case "activate":
            await activate(v);
            break;
          case "revoke":
            confirmAction(
              "撤销这项单次授权？",
              "<p>尚未使用的许可立即失效。再次操作需重新申请，原策略保持不变。</p>",
              "revoke",
              v,
            );
            break;
          case "confirm-revoke":
            closeModal();
            {
              const g = ctx().grants.find((x) => x.id === v);
              if (g.status === "active") {
                g.status = "revoked";
                log({
                  kind: "action",
                  title: "临时授权已撤销",
                  file: g.file,
                  reason: "模拟撤销及缓存失效回执完成。",
                });
              }
            }
            render();
            toast("授权已撤销。");
            break;
          case "expire": {
            const g = ctx().grants.find((x) => x.id === v);
            g.expiresAt = Date.now() - 1;
            expire();
            render();
            toast("已模拟到期；再次操作恢复原策略。");
            break;
          }
          case "export":
            exportReport();
            break;
          case "reset":
            confirmAction(
              "重置全部演示数据？",
              "<p>将清空此原型的策略、事件与授权，恢复初始模板。不会操作任何真实文件。</p>",
              "reset",
            );
            break;
          case "confirm-reset":
            closeModal();
            state = { os: "mac", persona: "dev", tab: "home", contexts: {} };
            query = "";
            filterKind = "all";
            lastResult = null;
            selectedScenario = "secret";
            render();
            toast("演示数据已重置。");
            break;
        }
      });
      $("#drawer").addEventListener("cancel", (e) => {
        e.preventDefault();
        if (!busy) closeDrawer();
      });
      $("#modal").addEventListener("cancel", (e) => {
        e.preventDefault();
        closeModal();
      });
      for (const id of ["drawer", "modal"])
        $("#" + id).addEventListener("click", (e) => {
          if (e.target !== e.currentTarget || busy) return;
          const r = e.currentTarget.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            id === "drawer" ? closeDrawer() : closeModal();
        });
      window.addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      setInterval(() => {
        if (expire()) {
          persist();
          if (!$("#drawer").open && !$("#modal").open) render();
        }
      }, 1000);
      render();
    </script>
  </body>
</html>
